function mkStar(c,r,ri){c.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,q=i%2?r*(ri||.382):r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
// straight-armed / flared cross: R = arm length, a = half width at the centre, b = half width at the tips
function mkCrossPath(c,R,a,b){const P=[[R,-b],[R,b],[a,a]];c.beginPath();let f=1;for(let k=0;k<4;k++){const ca=Math.cos(k*PI/2),sa=Math.sin(k*PI/2);for(const[x,y]of P){const X=x*ca-y*sa,Y=x*sa+y*ca;if(f){c.moveTo(X,Y);f=0}else c.lineTo(X,Y)}}c.closePath()}
function mkCross(c,R,a,b,fill,line,lw){mkCrossPath(c,R,a,b);if(line){c.lineJoin='miter';c.miterLimit=4;c.strokeStyle=line;c.lineWidth=lw*2;c.stroke()}if(fill){c.fillStyle=fill;c.fill()}}
function mkBars(c,cols,w,h){const n=cols.length;cols.forEach((q,i)=>{c.fillStyle=q;c.fillRect(-w/2,-h/2+h*i/n,w,h/n+.002)})}

const NEW21=`<div class="card" style="max-height:92vh;overflow:auto;width:min(560px,94vw);text-align:left"><h2>Armor Works 2.1</h2>
<b style="color:var(--ac);display:block;margin-top:8px">Sealed compartments</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Inner plates that link two different hull (or turret) edges, or loop round the crew or ammo, are <i>sealed</i> and glow green in the builder. Sealed plates block the blast of explosions inside the tank for the crew <i>and</i> the components behind them: an ammo explosion can be survived if every crewman is walled in. An unmanned turret is its own compartment: if its ammo blows, the hull is untouched.</small>
<b style="color:var(--ac);display:block;margin-top:8px">Roof machine guns</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Drop machine guns anywhere on the turret or hull roof: no cupola needed (up to 4). Drag them to move. Each gun has its own caliber, a model (standard, heavy M2/DShK style, GPMG, twin-linked, rotary minigun) and a Manned or Unmanned look (remote station with cameras and sensors). Models only change the look.</small>
<b style="color:var(--ac);display:block;margin-top:8px">New guns</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Howitzer (short, fat, HE/HESH/HEAT/smoke), Flamethrower (about 35 m of burning fuel that ignores armour; WW2 on) and Rotary cannon (about 3x the fire rate of an autocannon; Cold War on), each with its own detailed barrel model.</small>
<b style="color:var(--ac);display:block;margin-top:8px">Flag</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Place a flag on a pole on the roof and put any marking from any era or army on its cloth. It flutters in battle and streams behind the tank.</small>
<b style="color:var(--ac);display:block;margin-top:8px">Missile shoot-down</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Machine guns now kill incoming TOW and ATGM missiles by caliber: one 20 mm hit, two 10 mm hits or four 5 mm hits.</small>
<b style="color:var(--ac);display:block;margin-top:8px">Room codes</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Multiplayer → Room codes: Create room gives a 4-digit code, friends type it and press Join. It works from any web page, including GitHub Pages and iOS, because the code only does the first handshake through a free public relay; after that the game runs directly between the players. Invite codes still work too.</small>
<b style="color:var(--ac);display:block;margin-top:8px">Builder fixes</b><small style="display:block;margin:2px 0 6px;line-height:1.4">Internals are no longer hidden while the Markings panel is open (they fade instead), and there is an Internals shown / hidden button. Bigger calibers now get proportionally longer barrels.</small>

  if(!done){if(m.type=='OPEN'){done=1;clearTimeout(tm);S.hb=setInterval(()=>{if(ws.readyState==1)ws.send('{"type":"HEARTBEAT"}')},5000);res(S)}
   else if(m.type=='ID-TAKEN'||m.type=='INVALID-KEY'||m.type=='ERROR'){done=1;clearTimeout(tm);rej(new Error(m.type))}return}
  if(!S.dead)onmsg(m,S)};

 ws.onclose=()=>{clearInterval(S.hb);if(!done){done=1;clearTimeout(tm);rej(new Error('closed'))}else if(!S.dead&&onclose)onclose(S)}})}

{c:'Welcome',t:'<b>Full tank course.</b> We will build a good-looking WW2 medium tank with a sloped hull, a strong gun and the right systems, then learn how to fight and survive with it. Every step says how to do it by hand, or press <b>Do it for me</b> to watch it happen. Press the <b>Voice</b> button if you want the steps read aloud (it is off by default).',ok:null},

{c:'Inside the tank',t:'<b>Crew and modules.</b> Everything inside can be hit. Engine: lose it and you lose speed, and it may burn. Fuel tank: destroy it and you have no fuel, so you cannot move. Ammo: a hit can make it explode. Transmission and tracks: lose one and you are immobilised. Crew knocked out recover after 15 seconds. Drag modules to place them: engine and fuel low at the back, ammo low in the middle, away from the front plate.',ok:()=>Object.keys(TD.mp||{}).length>=4,do:CO.inside},
{c:'Inside the tank',t:'<b>Balance.</b> The red dot is the centre of mass and the tank tilts around it. Look at the readout under the sliders: aim for about 50% of the weight on the front tracks. A badly balanced or tall tank pitches much more over bumps and when it fires. Move the engine, fuel and ammo until it reads 45 to 55%.',ok:()=>{const t=eT();return t.lf>.42&&t.lf<.58},do:CO.inside},
{c:'Inside the tank',t:'<b>Inner plates against HEAT.</b> A shaped charge (HEAT) ignores speed, so thick front armor is its best target. Inner plates beat it. Open the <b>Armor</b> menu and drag <b>Inner plate</b> into the hull. If the first plate sits more than 25 cm behind the outer armor, the jet spreads in the gap and loses 40% of its penetration. Then every plate costs it 1.4 times that plate\'s thickness, and a plate it cannot beat stops it. Put a 30 mm plate behind the glacis, parallel to it, about 40 cm back.',ok:()=>(TD.ip||[]).some(q=>!q.f),do:CO.ip1},
{c:'Inside the tank',t:'<b>More inner plates.</b> Plates also stop spall (steel fragments), and they wear down any shell that gets through: a shell too weak to beat the plate stops there. Right-click a plate to add a connected one. Add a plate in front of the ammo, and a plate behind the turret front where the gun passes. Use <b>Show internals</b> to see them.',ok:()=>(TD.ip||[]).length>=3,do:CO.ip2},
{c:'Running gear and looks',t:'<b>Tracks and wheels.</b> Click the tracks. Seven or eight road wheels look right on a medium tank. Make the front and rear wheels a little bigger than the others. Torsion bars hold a heavy tank up better than coil springs. Drag the end dots to change the track length.',ok:()=>TD.nw>=7&&TD.sus=='t',do:CO.tracks},
{c:'Running gear and looks',t:'<b>Side skirts.</b> Open the <b>Armor</b> menu, click <b>Side skirt</b> and drag the button onto the tank (or drag the entry straight from the menu). It is cosmetic only (it takes no hits and adds no armor), but it hides the wheels and makes the tank look finished. Right-click its edges to add nodes and reshape it.',ok:()=>TD.sk&&TD.sk.length,do:CO.skirt},
{c:'Running gear and looks',t:'<b>Paint.</b> Scroll the left panel to Paint and camouflage. Pick a preset such as Woodland, or choose your own color and pattern. Press <b>Top view</b> to check the hull width: a wider hull costs more and weighs more.',ok:()=>TD.pm&&TD.pm!='none',do:CO.paint},
{c:'Systems',t:'<b>Engine.</b> Power is in horsepower per tonne. More power is faster but heavier and costlier. Diesel is reliable and rarely burns. A radial aircraft engine is light and powerful but big and fire-prone. A gas turbine is the lightest and fastest, but very expensive and fire-prone. A medium tank around 24 hp per tonne on a diesel is a good start.',ok:()=>TD.pw>=22,do:CO.engine},
{c:'Systems',t:'<b>Survival equipment.</b> Scroll to Equipment. <b>Automatic fire suppression</b> puts out the first fire after 2 seconds. <b>Self-sealing fuel tanks</b> cut the chance that a hit tank catches fire from 50% to 15%. <b>Blow-out ammo panels</b> vent an ammo explosion upward: the gunner and loader die, but the tank survives. <b>Wet ammo stowage</b> makes ammo 4 times less likely to explode, but you load 20% slower. The <b>repair kit</b> (hold F in battle) lets the crew fix damaged modules.',ok:()=>TD.ext&&TD.rpk&&TD.ssf&&TD.bop,do:CO.eq(['ext','rpk','ssf','bop'])},
{c:'Systems',t:'<b>Defensive equipment.</b> <b>Smoke launchers</b> (press X, three charges) lay a smoke screen: enemy gunners cannot target through smoke, so use it to retreat or to repair. <b>Reactive armor (ERA)</b> cuts HEAT and rocket jets by 45%, but only in the modern era. <b>Applique armor</b> gives 12% more protection for 1.2 tonnes. Take smoke now.',ok:()=>TD.smk,do:CO.eq(['smk'])},
{c:'Systems',t:'<b>Handling and fire control.</b> <b>Rangefinder and ballistic computer</b> draws where your shell will land. <b>Powered traverse</b> moves the gun 70% faster. <b>Improved optics</b> widens every vision port by 25% up and down. <b>Veteran crew</b> loads and aims 10% faster. <b>Wide tracks</b> keep you moving in mud and water, slowing you by 20% instead of 50%. Take them all: they are cheap next to armor.',ok:()=>TD.rf&&TD.pt,do:CO.eq(['rf','pt','opt','vet','wtk'])},
{c:'Systems',t:'<b>Modern-era gear.</b> Set Mode to Modern or Sandbox to unlock more. A <b>stabiliser</b> keeps the gun level while the hull pitches, so you can aim on the move. An <b>autoloader</b> reloads 40% faster with no loader. A <b>smoothbore gun</b> adds 8% muzzle velocity. Reactive armor, composite armor and gas turbines also appear here. Costs add up, and in the campaign each era has a budget, shown as Cost at the top.',ok:null},
{c:'Ammo',t:'<b>Ammo racks.</b> Every tank carries a limited number of rounds, kept in <b>ammo racks</b>. The <b>Ammo rack</b> entry in the <b>Internals</b> menu drops one into the hull or the turret; click it to choose which gun it feeds (the main gun, a machine gun, rockets, a TOW or a SAM launcher each have their own stock) and how big it is. A bigger caliber needs more room per round, so a 120 mm gun holds far fewer shells than a 75 mm. The farther a rack is from the loader, the slower you reload, so put a rack in the turret bustle next to the loader. A destroyed rack that still holds shells explodes. Drag an <b>Ammo rack</b> into the turret bustle, next to the loader, to feed the main gun.',ok:()=>rkTutOk(),do:CO.rack},
{c:'Ammo',t:'<b>Guided missiles (modern era).</b> You do not need to add any of these now. Open the <b>Missiles</b> menu (click or right-click it) to find the ATGM, TOW and SAM launchers; the Gun type list offers them too. Each launcher has its own ammo rack and round count, and its own shell in the Ammo tab (the shell only appears once you carry the matching launcher, and you can tune its speed, warhead and tandem option there). <b>TOW</b> is wire-guided: a thin wire unspools behind it and you steer the missile with the mouse. If the wire runs out (about 300 m) or your tank dies, the wire is cut and the missile flies on without guidance. Machine guns (set their caliber from 5 to 20 mm on the machine gun part) can shoot down incoming TOW, ATGM and mortar shells: aim at the missile.',ok:null},
{c:'Ammo',t:'<b>Top-attack ATGM.</b> Press <b>R</b> with the cursor over an enemy tank to lock it, then fire. The missile climbs high, then dives steeply onto the roof, where the armor is thinnest, so it beats thick front plates. Without a lock it dives onto the spot under your cursor. It is slow, so a fast tank can dodge it. (R locks aircraft for an SPAA and tanks for an ATGM tank; a vehicle cannot be both.)',ok:null},
{c:'Ammo',t:'<b>SAM (for SPAA).</b> An SPAA can carry a SAM launcher. It needs a <b>Search radar</b> first (tick it under Equipment), otherwise the SAM launcher stays grayed out. Press <b>R</b> with the cursor over an aircraft to radar-lock it, then fire: the missile leads the target and steers itself onto it, and bursts near it. Without a lock it flies straight. It is fast and powerful but you only carry a few, so lock first and do not waste them.',ok:null},
{c:'Ammo',t:'<b>Choosing shells.</b> Open the <b>Ammo</b> tab and tick the shells you carry. Armor-piercing shells (AP, APCBC, APCR) depend on speed and range. <b>HEAT</b> ignores speed, so it is good at long range, but inner plates and ERA hurt it. <b>HE</b> kills infantry, AT guns and aircraft but cannot hurt armor. Press 1 to 9 in battle to switch. A good mix is APCBC, HEAT and HE. All shell types share the gun\'s round stock, so watch the round counter above the shell buttons in battle.',ok:()=>tab=='ammo',do:CO.ammo},
{c:'Ammo',t:'<b>Tuning a shell.</b> Pick a shell and change its propellant (faster, but more recoil), filler, weight and cap. A heavier shell is slower and loads slower, but keeps its speed and hits harder inside. A ballistic cap means less drag and fewer ricochets off slopes. The table shows penetration at different angles, so use it to decide what to carry.',ok:()=>Object.keys(TD.ps||{}).length>0,do:CO.tune},
{c:'In battle',t:'<b>Save your tank.</b> Go back to the Tank tab, type a name next to <b>Save tank</b> and press the button. Saved tanks stay in your garage and can be loaded in any mode. When you finish this tutorial your own tank comes back, so save this one now.',ok:()=>garage.some(g=>(g.kind||'tank')=='tank'&&g.n==TD.n&&TD.n!='Custom'),do:CO.save},
{c:'In battle',t:'<b>Go to battle.</b> Open the <b>Play</b> tab and press Start. Controls: D drive, A reverse, mouse aims, left click fires, Space fires the machine gun, 1 to 9 choose the shell, Q and E switch guns, V shows vision cones, Esc pauses. The module bars at the top left show your tank\'s health. This panel stays on screen; press Next to read the next lesson in battle.',ok:()=>tab=='play',do:CO.play},
{c:'In battle',t:'<b>Repairing.</b> Hold <b>F</b>. The crew repairs damaged modules (wrecked ones first), taking up to about 24 seconds from a total wreck. You need a repair kit and a living crewman. While repairing you cannot drive, aim or fire, so first hide behind a hill or lay smoke. Destroyed tracks, engine, transmission or <b>fuel tank</b> stop you moving until fixed. Enemy tanks with repair kits do the same.',ok:null},
{c:'In battle',t:'<b>Fires.</b> A hit engine or fuel tank can start a fire, and a damaged ammo rack can start an ammo fire. Hold <b>G</b> and the crew puts it out; you cannot drive, aim or fire meanwhile, and you need a living crewman. Automatic fire suppression helps, and an ammo fire that is not put out explodes the rack, so act fast. Enemy tanks stop and put out their own fires too.',ok:null},
{c:'In battle',t:'<b>Smoke and sight.</b> Press X to lay smoke (three charges). Press <b>V</b> to see what each crewman can see: the cupola, the driver and the gunner each have a vision cone, and hills block them. Enemies obey the same limits, so sitting behind a ridge with only your gun showing is strong. Use depression to fight hull-down.',ok:null},
{c:'In battle',t:'<b>Tactics.</b> Angle your front toward the enemy so shells hit the slope. Shoot weak spots: the engine, ammo, tracks and the commander. Use HEAT on well-armored targets and HE on infantry. Watch the module bars: repair out of sight, put out fires, and retreat under smoke. Press Escape to return to the workshop whenever you like.',ok:null},
{c:'Done',t:'<b>Course complete.</b> You built a sloped, well-armored tank with inner plates, a braked long gun and a full set of survival systems, and you know how to repair, fire-fight and use smoke. Press <b>Do it for me</b> to save it as "Course tank" if you skipped that step, then Finish. Your own tank returns, and the saved one waits in your garage.',ok:null,do:CO.save}
];
